<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AO3 SVG Badge generator</title>
  <style>  
    body {
      height: 100%;
      margin: 5px;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      height: 100vh;
      flex: 1 1 auto;
    }
    #setup {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: stretch;
    }
    #setup :first-child {
      flex-grow: 1;
    }
    #code {
      flex: 1 1 auto;
    }
    fieldset {
      border: 0;
      padding: 2px;
    }
    label span {
      display: inline-block;
      width: 10em;
    }
  </style>
</head>
<body>

  <div id="container">
    <div id="setup">
      <div id="form"></div>
      <div id="preview"></div>
    </div>
    <textarea id="code"></textarea>
  </div>


  <script>
    let fields = [
      { parent:"colors", id: "logo", label: "Logo", value: "#14a" },
      { parent:"colors", id: "text", label: "Text & lines", value: "white" },
      { parent:"colors", id: "border", label: "Text border", value: "black" },
      { parent:"colors", id: "background", label: "Badge", value: "#900" },
      { parent:"colors", id: "shadow", label: "Badge edge", value: "#400" },
      { parent:"colors", id: "spark", label: "Spark", value: "white" },

      { parent:"texts", id: "text1.text", label: "Line 1 text", value: "I was there for" },
      { parent:"texts", id: "text2.text", label: "Line 2 text", value: "" },
      { parent:"texts", id: "text3.text", label: "Line 3 text", value: "βετα" },
      { parent:"texts", id: "text4.text", label: "Line 4 text", value: "(for a bit anyway)" },
      { parent:"fonts", id: "text1.font", label: "Line 1 font", value: "'Lucida sans', Grande" },
      { parent:"fonts", id: "text2.font", label: "Line 2 font", value: "'Lucida sans', Grande" },
      { parent:"fonts", id: "text3.font", label: "Line 3 font", value: "Georgia" },
      { parent:"fonts", id: "text4.font", label: "Line 4 font", value: "Georgia" },
      { parent:"sizes", id: "text1.size", label: "Line 1 size", value: "12em" },
      { parent:"sizes", id: "text2.size", label: "Line 2 size", value: "8em" },
      { parent:"sizes", id: "text3.size", label: "Line 3 size", value: "18em" },
      { parent:"sizes", id: "text4.size", label: "Line 4 size", value: "6em" },
      { parent:"variant", id: "text1.variant", label: "Line 1 variant", value: "small-caps" },
      { parent:"variant", id: "text2.variant", label: "Line 2 variant", value: "" },
      { parent:"variant", id: "text3.variant", label: "Line 3 variant", value: "" },
      { parent:"variant", id: "text4.variant", label: "Line 4 variant", value: "" },
      { parent:"lines", id: "line2.y", label: "Line 2 y", value: "250" },
      { parent:"lines", id: "line3.y", label: "Line 3 y", value: "700" },

      { parent:"circle", id: "lines.radius", label: "Side lines radius", value: "38" },
      { parent:"circle", id: "lines.start", label: "Side lines start angle", value: "65" },
      { parent:"circle", id: "lines.end", label: "Side lines end angle", value: "140" },

      { parent:"logo", id: "logo.size", label: "Logo size", value: "80" },
      { parent:"logo", id: "logo.dx", label: "Logo x", value: "0" },
      { parent:"logo", id: "logo.dy", label: "Logo y", value: "-10" },
    ];

    function applyValueOf(svg, property) {
      let elmt = document.getElementById(property);
      svg = svg.replace(`{${property}}`, elmt.value).replace(`{${property}}`, elmt.value);
      return svg;
    }

    function apply(svg) {
      for (let field of fields) {
        svg = applyValueOf(svg, field.id);
      }

      let innerRadius = document.getElementById("lines.radius").value;
      svg = svg.replace("{badgeGradientStop1}", innerRadius * 72 / 38);
      svg = svg.replace("{line1.left}", 500 - innerRadius * 10);
      svg = svg.replace("{line1.right}", 500 + innerRadius * 10);
      svg = svg.replace(/{line1.radius}/g, innerRadius * 10);
      svg = svg.replace("{line4.left}", 500 - innerRadius * 10);
      svg = svg.replace("{line4.right}", 500 + innerRadius * 10);
      svg = svg.replace(/{line4.radius}/g, innerRadius * 10);

      let logoSize = document.getElementById("logo.size").value;
      let logoX = document.getElementById("logo.dx").value;
      let logoY = document.getElementById("logo.dy").value;
      svg = svg.replace("{logo.width}", logoSize * 0.56);
      svg = svg.replace("{logo.height}", logoSize * 0.56 * 2 / 3);
      svg = svg.replace("{logo.x}", 50 - logoSize * (28 - logoX) / 100);
      svg = svg.replace("{logo.y}", 50 - logoSize * (22 - logoY) / 100);

      document.getElementById("code").innerHTML = svg;
      document.getElementById("preview").innerHTML = svg;
    }

    function generateField(field) {
      return `        <fieldset>
              <label>
                  <span>{label}: </span>
                  <input id="{id}" value="{value}" onchange="apply(template)" />
              </label>
          </fieldset>`
          .replace("{id}", field.id)
          .replace("{label}", field.label)
          .replace("{value}", field.value);
    }

    function generateForm() {
      let str = "";
      for (let field of fields) {
        str += generateField(field);
      }

      let elmt = document.getElementById("form");
      form.innerHTML = str;
    }

    let template = `<?xml version="1.0" encoding="UTF-8"?>
<svg  version="1.1" xmlns="http://www.w3.org/2000/svg"
  width="300" height="300" viewBox="0 0 1000 1000">

  <style>
    /* <![CDATA[ */

    /* ----- VARIABLES - adjust to your liking ----- */

    /* ----- COLORS ----- */
    /* logo: ao3 logo color */
    /* color: text color */
    /* border: text and logo border color */
    /* background: badge background color */
    /* shadow: badge color at border */
    /* spark: spark of light, white */
    /* halo: halo color, mixed between spark and background */

    /* ----- ARCS ON BOTH SIDES ----- */
    /* start: arc's start angle (from top) */
    /* end: arc's end angle (from top) */

    /* ----- FONT SIZES ----- */
    /* base-font-size: used for 2 top lines */
    /* highlight-font-size: used for bottom straight text */
    /* note-font-size: used for bottom rounded text */

    svg {
      --logo: {logo};
      --color: {text};
      --border: {border};
      --background: {background};
      --shadow: {shadow};
      --spark: {spark};
      --halo: color-mix(in hsl, var(--spark) 50%, var(--background));

      --start: {lines.start};
      --end: {lines.end};

      --font-family-1: {text1.font};
      --font-size-1: {text1.size};
      --font-variant-1: {text1.variant};
      --font-stroke-width-1: 1;

      --font-family-2: {text2.font};
      --font-size-2: {text2.size};
      --font-variant-2: {text2.variant};
      --font-stroke-width-2: 1;

      --font-family-3: {text3.font};
      --font-size-3: {text3.size};
      --font-variant-3: {text3.variant};
      --font-stroke-width-3: 4;

      --font-family-4: {text4.font};
      --font-size-4: {text4.size};
      --font-variant-4: {text4.variant};
      --font-stroke-width-4: 1;
    }

    /* ----- TEXT COLORS ----- */

    text {
      fill: var(--color);
      stroke: var(--border);
    }

    #logo {
      fill: var(--logo);
      stroke: var(--border);
      stroke-width: 3;
    }

    /* ----- BADGE ----- */

    /* location */
    .badge circle {
      cx: 50%;
      cy: 50%;
    }

    /* size */
    .background {
      r: 50%;
    }
    .arc {
      r: {lines.radius}%;
    }
    
    /* lines on both sides */
    .arc {
      --angle: calc(var(--end) - var(--start));

      fill: none;
      stroke: var(--color);
      stroke-width: 3;
      stroke-linecap: round;

      stroke-dasharray: var(--angle) 360;
      stroke-dashoffset: calc(-1 * var(--start));

      transform-origin: center;
    }
    .arc-left {
      transform: rotate(-90deg) scaleY(-1);
    }
    .arc-right {
      transform: rotate(-90deg);
    }

    /* background color radient */
    #badge stop:nth-child(1) {
      stop-color: var(--background);
    }
    #badge stop:nth-child(2) {
      stop-color: var(--shadow);
    }

    /* big halo on background */
    #halo {
      cx: 50%;
      cy: 50%;
      r: 45%;
      fill: url(#haloRadient);
    }
    #haloRadient stop {
      stop-color: var(--halo);
    }

    /* little spark of light on everything */
    /* for best effect, cx,cy should be equal to fx,fy of <radialGradient id="sparkRadient"> */
    #spark {
      cx: 65%;
      cy: 25%;
      r: 20%;
      fill: url(#sparkRadient);
    }
    #sparkRadient stop {
      stop-color: var(--spark);
    }

    /* ----- FONTS ----- */

    svg {
      font-size: 10px;
    }
    text {
      text-anchor: middle;
    }
    #text1 {
      font-size: var(--font-size-1);
      font-family: var(--font-family-1);
      font-variant: var(--font-variant-1);
      stroke-width: var(--font-stroke-width-1);
    }
    #text2 {
      font-size: var(--font-size-2);
      font-family: var(--font-family-2);
      font-variant: var(--font-variant-2);
      stroke-width: var(--font-stroke-width-2);
    }
    #text3 {
      font-size: var(--font-size-3);
      font-family: var(--font-family-3);
      font-variant: var(--font-variant-3);
      stroke-width: var(--font-stroke-width-3);
    }
    #text4 {
      font-size: var(--font-size-4);
      font-family: var(--font-family-4);
      font-variant: var(--font-variant-4);
      stroke-width: var(--font-stroke-width-4);
    }

    .textPath {
      fill: none;
    }

    /* ]]> */
  </style>

  <defs>

    <!-- gradient for badge, different color at the edge -->
    <radialGradient id="badge" >
      <stop offset="{badgeGradientStop1}%" />
      <stop offset="100%" />
    </radialGradient>

    <!-- gradient for small halo, mostly opaque at center and transparent at the edge -->
    <radialGradient id="sparkRadient" >
      <stop offset="5%" stop-opacity="0.7" />
      <stop offset="10%" stop-opacity="0.6" />
      <stop offset="20%" stop-opacity="0.5" />
      <stop offset="100%" stop-opacity="0" />
    </radialGradient>

    <!-- gradient for big halo, mostly opaque at center and transparent at the edge -->
    <!-- for best effect, fx,fy should be equal to cx,cy of <style> #halo -->
    <radialGradient id="haloRadient" fx="65%" fy="25%" >
      <stop offset="30%" stop-opacity="0.3" />
      <stop offset="60%" stop-opacity="0" />
    </radialGradient>
    
  </defs>

  <!-- badge -->
  <svg width="100%" height="100%" class="badge">

    <!-- background -->
    <circle fill="url(#badge)" class="background" />

    <!-- lines -->
    <circle class="arc arc-left" pathLength="360" />
    <circle class="arc arc-right" pathLength="360" />

    <!-- halo -->
    <circle id="halo" />

  </svg>

  <!-- path followed by texts: don't change unless you know what you're doing -->
  <path id="topRoundLine" class="textPath" d="M {line1.left} 500 A {line1.radius} {line1.radius} 0 0 1 {line1.right} 500" />
  <path id="topStraightLine" class="textPath" d="M 0 {line2.y} L 1000 {line2.y}" />
  <path id="bottomStraightLine" class="textPath" d="M 0 {line3.y} L 1000 {line3.y}" />
  <path id="bottomRoundLine" class="textPath" d="M {line4.left} 500 A {line4.radius} {line4.radius} 0 0 0 {line4.right} 500" />

  <!-- 4 lines of text from top to bottom: edit your text -->
  <text id="text1"><textPath href="#topRoundLine" startOffset="50%">{text1.text}</textPath></text>
  <text id="text2"><textPath href="#topStraightLine" startOffset="50%">{text2.text}</textPath></text>
  <text id="text3"><textPath href="#bottomStraightLine" startOffset="50%">{text3.text}</textPath></text>
  <text id="text4"><textPath href="#bottomRoundLine" startOffset="50%">{text4.text}</textPath></text>

  <!-- logo: play with x,y for location, width,height for size. height=width*2/3. don't touch anything else -->
  <svg x="{logo.x}%" y="{logo.y}%" width="{logo.width}%" height="{logo.height}%" viewBox="0 0 600 415">
    <path id="logo"
      d="m370.16 10.811c-54.019 0-97.816 42.648-97.816 95.266 0 52.608 43.797 95.244 97.816 95.244s97.816-42.636 97.816-95.244c0-52.618-43.797-95.266-97.816-95.266zm-355.28 4.582c-2.9356 0.1201-4.0242 0.92857-4.8105 1.7188 0 0-1.2608 5.0412 7.9844 6.7148 9.2351 1.6837 62.165 17.231 134.85 74.355 72.671 57.135 112.16 107.96 140.3 137.79 0 0-85.697 30.246-186.09 96.615 0 0 35.286-42.426 49.148-147.87 2.0265-15.415 5.7679-34.651 7.5625-52.93 0 0 2.0969-14.699-3.3574-14.699-5.4644 0-14.287 73.517-29.41 119.3-8.237 24.933-18.48 55.875-47.889 96.203-18.188 24.953-36.366 43.665-32.344 52.094 8.8217 18.48 27.303 0.41407 27.303 0.41407s117.63-77.712 241.13-115.94c0 0 30.074 32.897 35.428 39.229 16.121 19.055 27.686 40.117 41.438 39.754 11.171-0.30246 15.124-6.3012 21.012-38.654 5.8778-32.343 18.902-64.273 18.902-64.273s74.033-3.5589 77.713 20.164c2.46 15.849-8.549 24.016-17.32 26.93-4.2748 1.4316-17.432 5.2615-22.896 6.8242-10.223 2.9137-12.834 18.44 4.0938 25.9 27.625 12.169 55.945 18.229 53.344 39.492-2.5205 20.577-36.588 30.852-60.492 25.619-44.109-9.6586-46.226-30.206-53.768-27.303-5.4644 2.097 10.082 18.903 18.48 24.367 8.4084 5.4544 70.161 36.549 102.5-2.1055 36.557-43.675-33.604-70.988-33.604-70.988s43.262-19.328 35.287-55.875c-7.985-36.547-55.039-42.011-89.902-44.945 0 0 15.123-38.23 49.986-78.135 18.127-20.749 46.75-44.3 63.859-57.135 16.797-12.602 29.743-14.851 26.043-22.262-4.2042-8.3983-72.258 40.752-85.273 52.508-13.026 11.766-50.834 48.726-82.34 105.02 0 0-50.824 2.5208-89.479 11.756 0 0-55.028-59.644-119.3-109.64-64.273-49.987-124.34-80.234-160.89-91.576-22.287-6.9188-32.309-8.6338-37.201-8.4336zm355.28 20.654c39.713 0 71.904 31.345 71.904 70.029 0 38.664-32.191 70.02-71.904 70.02s-71.904-31.355-71.904-70.02c0-38.685 32.191-70.029 71.904-70.029zm34.158 212.75s-10.688 21.141-15.709 42.031c-8.8419-11.191-29.621-33.824-29.621-33.824s15.77-4.0532 45.33-8.207z" />
  </svg>

  <!-- spark of light -->
  <circle id="spark" />

</svg>`;

    generateForm();
    apply(template);
  </script>

</body>
</html>
